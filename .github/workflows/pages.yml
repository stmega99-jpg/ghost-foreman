# Publishes the public demo (sample data only) to GitHub Pages.
# What is published is decided by scripts/build_demo_site.py: five files plus a redirect page. Nothing else from the
# repository (backend, data, tests, docs) is uploaded.
name: Publish demo site

on:
  push:
    branches: [main]
    paths:
      - "demo/**"
      - "ui/dist/index.mjs"
      - "ui/m/vendor/react.mjs"
      - "scripts/build_demo_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build the site (explicit file list)
        run: python scripts/build_demo_site.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4